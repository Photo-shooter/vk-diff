name: Build macOS app

on:
  workflow_dispatch:        # запускается вручную с вкладки Actions
  push:
    tags: [ "v*" ]          # или автоматически на тег вида v1.0

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-14, macos-13 ]   # macos-14 — Apple Silicon, macos-13 — Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pillow imagehash pyinstaller

      - name: Build .app
        run: |
          pyinstaller --windowed --name vk-diff --clean AlbumSync.py
          codesign --force --deep --sign - dist/vk-diff.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-diff-${{ matrix.os }}
          path: dist/

      - name: Log tkinter availability
        if: failure()
        run: python3 -c "import tkinter; print(tkinter.TkVersion)"
