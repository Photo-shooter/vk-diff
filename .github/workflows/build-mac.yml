name: Build macOS app

on:
  workflow_dispatch:      # запуск вручную кнопкой со вкладки Actions

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-15, macos-15-intel ]   # macos-15 = Apple Silicon, macos-15-intel = Intel
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pillow imagehash pyinstaller

      - name: Build .app
        run: |
          pyinstaller --windowed --name vk-diff --clean vk-diff.py
          codesign --force --deep --sign - dist/vk-diff.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-diff-${{ matrix.os }}
          path: dist/

      - name: Check tkinter (диагностика при падении)
        if: failure()
        run: python3 -c "import tkinter; print(tkinter.TkVersion)"
