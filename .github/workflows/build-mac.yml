name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List python files
        run: ls -la *.py

      - name: Install Python with tkinter
        run: brew install python@3.13 python-tk@3.13

      - name: Install dependencies
        run: |
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install requests pillow imagehash pyinstaller

      - name: Check tkinter
        run: |
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Build .app
        run: |
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -m PyInstaller --windowed --name vk-diff --clean vk-diff.py
          codesign --force --deep --sign - dist/vk-diff.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-diff-macos-arm64
          path: dist/
