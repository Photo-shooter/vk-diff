name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Python with tkinter
        run: brew install python@3.13 python-tk@3.13

      - name: Create venv and install dependencies
        run: |
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install requests pillow imagehash pyinstaller

      - name: Check tkinter
        run: ./.venv/bin/python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Build .app
        run: |
          ./.venv/bin/pyinstaller --windowed --name vk-diff --clean AlbumSync.py
          codesign --force --deep --sign - dist/vk-diff.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-diff-macos-arm64
          path: dist/
