name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install requests pillow imagehash pyinstaller

      - name: Check tkinter
        run: ./.venv/bin/python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Build .app
        run: |
          ./.venv/bin/pyinstaller --windowed --name vk-diff --clean vk-diff.py
          codesign --force --deep --sign - dist/vk-diff.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-diff-macos
          path: dist/
